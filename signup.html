<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Image Recognition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Image Recognition</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="chatbot.html">Chatbot</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="content container">
    <section class="auth-section">
      <h2>Sign Up</h2>
      <form class="auth-form" action="#" method="post">
        <label>
          Full Name
          <input type="text" name="name" placeholder="Full name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Create a password" required>
        </label>
        <button class="btn" type="submit">Create Account</button>
        <p class="auth-note">This signup page is built with external CSS only.</p>
        <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Sign up is a static UI demonstration without backend processing.</p>
    </div>
  </footer>
</body>
</html>
