<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Image Recognition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Image Recognition</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="chatbot.html">Chatbot</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="content container">
    <section class="auth-section">
      <h2>Login</h2>
      <form class="auth-form" action="#" method="post">
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Password" required>
        </label>
        <button class="btn" type="submit">Login</button>
        <p class="auth-note">This login page is a static HTML/CSS prototype without backend connectivity.</p>
        <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Login is styled with external CSS and no inline scripts.</p>
    </div>
  </footer>
</body>
</html>
