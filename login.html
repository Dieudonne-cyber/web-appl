<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AI Recognition &amp; Chatbot System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-navbar"></div>

  <main>
    <div class="container narrow">
      <div class="card">
        <h1 class="page-title">Login</h1>

        <div class="form-message" id="form-message" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="identifier">Username or Email</label>
            <input type="text" id="identifier" name="identifier" autocomplete="username" required />
            <p class="field-error" id="identifier-error"></p>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <p class="field-error" id="password-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="form-footnote"><a href="#" onclick="alert('Password recovery is not implemented in this prototype.'); return false;">Forgot password?</a></p>
        <p class="form-footnote">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 AI-Powered Image Recognition and Intelligent Chatbot System — Web Design Project.
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => renderNavbar("login"));
  </script>
</body>
</html>
