<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot | AI Recognition &amp; Chatbot System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-navbar"></div>

  <main>
    <div class="container narrow">
      <h1 class="page-title">AI Chatbot Assistant</h1>

      <p class="chat-context" id="chat-context"></p>

      <div class="chat-window" id="chat-window" aria-live="polite"></div>

      <form id="chat-form" class="chat-input-row">
        <label for="chat-input" class="visually-hidden">Type your question</label>
        <input type="text" id="chat-input" placeholder="Type your question…" autocomplete="off" required />
        <button type="submit" class="btn btn-primary" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 AI-Powered Image Recognition and Intelligent Chatbot System — Web Design Project.
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ai-services.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
